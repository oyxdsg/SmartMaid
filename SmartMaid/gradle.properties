# Gradle 运行参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.2：不再混淆/发布 mappings，直接使用官方类名，无需 mappings 配置。
# 构建时必须用 JDK 25（Minecraft 26.2 要求，fabric-api 0.158.0+26.2 要求 java>=25）。
# 安装任意 JDK 25 后指向它即可，例如（Windows PowerShell）：
#   $env:JAVA_HOME="<你的 JDK 25 安装目录>"; .\gradlew.bat build

minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.158.0+26.2

# ---- 多版本兼容（详见 SmartMaid/DESIGN_MULTIVERSION.md）----
# mc_series 决定用哪个「版本专属源码目录」：src/mc<series>/java
#   = 差异隔离层（com.oyxdsg.smartmaid.compat.MaidCompat 等版本敏感实现）所在
# 默认 26.2（= 现有开发流不变）。切到 26.3 时改这四个 + mc_series：
#   mc_series=26.3
#   minecraft_version=26.3
#   loader_version=0.19.5
#   loom_version=1.18-SNAPSHOT
#   fabric_api_version=0.161.0+26.3
mc_series=26.2

# 产物 fabric.mod.json 里声明的版本范围（留空则自动取 ~<mc_series>）。
# 26.1 系列要覆盖 26.1 / 26.1.1 / 26.1.2，所以显式写 ~26.1 更稳。
# minecraft_range=~26.2
# fabric_api_range=>=0.158.0+26.2

mod_version=0.1.3
maven_group=com.oyxdsg.smartmaid
archives_base_name=smartmaid
